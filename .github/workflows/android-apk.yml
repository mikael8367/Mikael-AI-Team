name: Android APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Install Node dependencies
        run: npm install
      - name: Configure backend URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Repository variable API_BASE_URL is required. Deploy the backend and add its HTTPS URL in Settings > Secrets and variables > Actions > Variables."
            exit 1
          fi
          node <<'NODE'
          const fs = require("node:fs");
          const url = process.env.API_BASE_URL;
          if (!/^https:\/\//.test(url)) throw new Error("API_BASE_URL must use HTTPS");
          fs.writeFileSync("public/runtime-config.js", "window.MIKAEL_API_BASE = " + JSON.stringify(url.replace(/\/$/, "")) + ";\n");
          NODE
      - name: Generate Android project
        run: npx cap add android
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mikael-AI-Team-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
